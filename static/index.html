      });

      // Die Punktfolge der aktuell gezeichneten Route. Die simulierte Fahrt
      // braucht sie, um GENAU die Strecke abzufahren, die diese Seite berechnet
      // hat. Fuhr sie ihre eigene, lagen beide Starts rund 30 Meter auseinander
      // — und ein Manoever 11 Meter hinter dem Start galt dadurch als
      // uebersprungen, obwohl es korrekt angezeigt worden waere.
      window.kartenRoute = () => letzteKoordinaten;

      // Was wird an dieser Bildstelle tatsaechlich gezeichnet? Ein Foto zeigt
      // eine blaue Flaeche, sagt aber nicht, ob sie ein See ist, ein zu breit
      // gemalter Bach oder ein Darstellungsfehler. Genau daran ist die Suche
      // nach den falschen Wasserflaechen zuerst haengengeblieben: die Deutung
      // eines Bildpunktes ist keine Messung. Ebenfalls nur lesend.
      window.kartenTreffer = (x, y) => map.queryRenderedFeatures([x, y]).map(t => ({
        ebene: t.layer.id,
        quellebene: t.layer['source-layer'] || null,
        geometrie: t.geometry.type,
        art: t.properties.kind || t.properties.class || null,
        name: t.properties.name || null,
      }));

      // ---- Höhenprofil zur Route --------------------------------------------
      // Valhalla liefert `elevation` je Bein, sobald die Routing-Kacheln MIT
      // Höhendaten gebaut sind. Fehlt das Feld, gibt diese Funktion einen leeren
      // String zurück und die Routenausgabe sieht aus wie vorher — deshalb darf
      // `elevation_interval` dauerhaft in der Anfrage stehen.
      function hoehenAbschnitt(beine) {
        const roh = beine.flatMap(l => Array.isArray(l.elevation) ? l.elevation : []);
        const hoehen = roh.filter(h => typeof h === 'number' && isFinite(h));
        if (hoehen.length < 4) return '';

        // ★ Ohne Höhendaten antwortet Valhalla nicht mit gar nichts, sondern mit
        //   lauter Nullen. Ein flaches Nullprofil ist keine fehlende Angabe,
        //   sondern eine falsche — im Bergischen erst recht. Also lieber nichts
        //   zeigen als eine Ebene behaupten.
        let min = hoehen.reduce((a, b) => Math.min(a, b), Infinity);
        let max = hoehen.reduce((a, b) => Math.max(a, b), -Infinity);
        if (max - min < 0.5) return '';

        // ★★ Glätten, BEVOR summiert wird: die Messpunkte schwanken um
        //    Zehntelmeter, und die Summe dieser Zappelei ergäbe dreistellige
        //    Höhenmeter auf ebener Strecke. Gleitendes Mittel über fünf Punkte,
        //    bei 50-m-Abtastung also über 250 m Strecke.
        //    Die ausgewiesene Steigung hängt damit von der Glättung ab — das
        //    ist bei jeder Fahrrad-App so, nur sagt es keine dazu.
        const glatt = hoehen.map((_, i) => {
          const teil = hoehen.slice(Math.max(0, i - 2), Math.min(hoehen.length, i + 3));
          return teil.reduce((a, b) => a + b, 0) / teil.length;
        });

        // ★★★ Summiert wird über ALLE Punkte, ausgedünnt wird erst danach fürs
        //     Bild. Andersherum — erst ausdünnen, dann summieren — hinge die
        //     ausgewiesene Steigung an der Streckenlänge: eine 100-km-Tour
        //     würde stärker ausgedünnt und käme deshalb mit weniger
        //     Höhenmetern je Kilometer heraus als dieselbe Strecke einzeln
        //     berechnet. Gemessen: 343 m gegen 295 m für dieselbe Route,
        //     je nachdem wie fein abgetastet wurde.
        let auf = 0, ab = 0;
        for (let i = 1; i < glatt.length; i++) {
          const d = glatt[i] - glatt[i - 1];
          if (d > 0) auf += d; else ab -= d;
        }

        // Fürs Bild reichen 400 Stützpunkte — mehr als das Profil breit ist,
        // wäre unsichtbar und stünde trotzdem im Markup.
        let zeichnung = glatt;
        if (zeichnung.length > 400) {
          const schritt = Math.ceil(zeichnung.length / 400);
          zeichnung = zeichnung.filter((_, i) => i % schritt === 0);
        }

        const B = 260, H = 46, rand = 3;
        // Nie flacher als 10 m skalieren, sonst macht die Automatik aus einer
        // Bodenwelle ein Gebirge.
        const spanne = Math.max(max - min, 10);
        const punkt = (h, i) =>
          `${((i / (zeichnung.length - 1)) * B).toFixed(1)},` +
          `${(H - rand - ((h - min) / spanne) * (H - 2 * rand)).toFixed(1)}`;
        const linie = zeichnung.map(punkt).join(' ');

        return `<div class="steig">Anstieg <b>${Math.round(auf)} m</b> · ` +
               `Abstieg <b>${Math.round(ab)} m</b> · ` +
               `${Math.round(min)}–${Math.round(max)} m ü. NN</div>` +
               `<div class="profil"><svg viewBox="0 0 ${B} ${H}" preserveAspectRatio="none">` +
               `<polygon points="0,${H} ${linie} ${B},${H}" fill="#cfdcea"/>` +
               `<polyline points="${linie}" fill="none" stroke="#3a6ea5" ` +
               `stroke-width="1.2" vector-effect="non-scaling-stroke"/>` +
               '</svg></div>';
      }

      // ---- Gemerkte Orte ----------------------------------------------------
      // Bewusst im Browser (localStorage) und nicht auf dem Server: die Karte ist
      // ein read-only-Dienst ohne Anmeldung, ein Merkzettel pro Geraet passt dazu
      // besser als ein weiterer Dienst mit Datenhaltung. Zuhause, Arbeit, das
      // Ferienhaus — solche Orte tippt man sonst bei jeder Route neu.
      const MERK_SCHLUESSEL = 'karten.gemerkte-orte';

      function merkListe() {
        try {
          const roh = JSON.parse(localStorage.getItem(MERK_SCHLUESSEL) || '[]');
          return Array.isArray(roh) ? roh : [];
        } catch (e) { return []; }
      }

      function merkSchreiben(liste) {
        try {
          localStorage.setItem(MERK_SCHLUESSEL, JSON.stringify(liste.slice(0, 60)));
          if (typeof merkKnopfAuffrischen === 'function') merkKnopfAuffrischen();
        } catch (e) {
          warn('Ort konnte nicht gemerkt werden — Speicher des Browsers voll oder gesperrt.');
        }
      }

      function merkeOrt(name, lat, lon) {
        const liste = merkListe();
        // Gleiche Stelle nur einmal: eine Nachkommastelle weniger als die
        // Anzeige, damit ein leicht verschobener zweiter Druck nicht doppelt.
        const gleich = (a, b) => Math.abs(a - b) < 0.0002;
        const vorhanden = liste.findIndex(o => gleich(o.lat, lat) && gleich(o.lon, lon));
        if (vorhanden >= 0) liste.splice(vorhanden, 1);
        liste.unshift({ n: name, lat, lon });
        merkSchreiben(liste);
      }

      // Stern-Knopf: blass, solange nichts gemerkt ist — dann sieht man auf
      // einen Blick, dass die Liste leer ist, statt sie vergeblich zu oeffnen.
      const merkBtn = document.getElementById('merkbtn');
      function merkKnopfAuffrischen() {
        const n = merkListe().length;
        merkBtn.classList.toggle('leer', n === 0);
        merkBtn.title = n ? `Gemerkte Orte (${n})` : 'Noch nichts gemerkt — langer Druck auf die Karte';
      }
      merkBtn.onclick = () => {
        if (!merkListe().length) {
          trefferBox.innerHTML = '<div class="weg" style="padding:9px 12px">' +
            'Noch nichts gemerkt. Langer Druck auf die Karte → „Ort merken“.</div>';
          trefferBox.style.display = 'block';
          return;
        }
        eingabe.value = '';
        zeigeMerkliste();
      };

      function zeigeMerkliste() {
        const liste = merkListe();
        trefferBox.innerHTML = '';
        auswahl = -1;
        merkKnopfAuffrischen();
        if (!liste.length) {
          trefferBox.style.display = 'none';
          return;
        }
        liste.forEach((o, i) => {
          const z = document.createElement('div');
          z.className = 'merk';
          z.innerHTML = '<span class="stern">★</span><b></b><span class="meta"></span>' +
                        '<span class="weg" title="Vergessen">&times;</span>';
          z.querySelector('b').textContent = o.n;
          z.querySelector('.meta').textContent =
            o.lat.toFixed(4) + ', ' + o.lon.toFixed(4);
          z.querySelector('.weg').onclick = (ev) => {
            ev.stopPropagation();          // sonst springt die Karte beim Loeschen
            const l = merkListe();
            l.splice(i, 1);
            merkSchreiben(l);
            zeigeMerkliste();
          };
          z.onclick = () => springe(o);
          trefferBox.appendChild(z);
        });
        trefferBox.style.display = 'block';
      }

      // ---- Kartenmenue (Rechtsklick am Rechner, langer Druck am Handy) ------
      // Der „Mitte"-Knopf deckt nur die Routenplanung ab. Fuer alles andere
      // fehlte ein Weg, einen beliebigen Punkt anzufassen — gerade unterwegs
      // will man auf eine Stelle zeigen, nicht die Karte darunter schieben.
      const kmenue = document.getElementById('kmenue');

      function menueSchliessen() { kmenue.style.display = 'none'; }

      function menueOeffnen(punkt, lngLat) {
        const lat = lngLat.lat, lon = lngLat.lng;
        const eintraege = [
          ['Route von hier', () => routenpunktSetzen('rstart', lat, lon)],
          ['Route hierhin', () => routenpunktSetzen('rziel', lat, lon)],
          ['Ort merken', () => {
            const name = prompt('Name für diesen Ort:',
                                lat.toFixed(4) + ', ' + lon.toFixed(4));
            if (name === null) return;
            merkeOrt(name.trim() || (lat.toFixed(4) + ', ' + lon.toFixed(4)), lat, lon);
            // Rueckmeldung, wo der Ort gelandet ist — sonst merkt man ihn und
            // sieht danach nichts, was sich geaendert haette.
            hud.textContent = 'Gemerkt — über den Stern ★ neben der Suche';
          }],
          ['Koordinaten kopieren', () => koordinatenKopieren(lat, lon)],
          ['Wie weit komme ich?', () => erreichbarkeitZeigen(lat, lon)],
        ];
        if (map.getLayer('erreichbar-flaeche')) {
          eintraege.push(['Erreichbarkeit ausblenden', erreichbarkeitLoeschen]);
        }
        kmenue.innerHTML = '<div class="kopf">' +
          lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>';
        eintraege.forEach(([text, tun]) => {
          const b = document.createElement('button');
          b.textContent = text;
          b.onclick = () => { menueSchliessen(); tun(); };
          kmenue.appendChild(b);
        });
        // Am rechten/unteren Rand nach innen klappen, sonst steht das Menue
        // halb ausserhalb des Bildschirms.
        kmenue.style.display = 'block';
        const breite = kmenue.offsetWidth, hoehe = kmenue.offsetHeight;
        kmenue.style.left = Math.max(4, Math.min(punkt.x, window.innerWidth - breite - 4)) + 'px';
        kmenue.style.top = Math.max(4, Math.min(punkt.y, window.innerHeight - hoehe - 4)) + 'px';
      }

      // ---- Erreichbarkeit (Isochronen) --------------------------------------
      // Valhalla rechnet die Flaeche, die man in einer gegebenen Zeit erreicht.
      // Das kostet keine eigenen Daten und keinen Bau — der Routing-Dienst kann
      // es, seit es ihn gibt; es hat nur nie jemand danach gefragt. Seit die
      // Kacheln Hoehendaten tragen, ist der Radius fuer Rad und Fuss auch
      // ehrlich: bergauf kommt man weniger weit.
      const ERREICHBAR_ZEITEN = {
        auto: [10, 20, 30],
        bicycle: [10, 20, 30],
        pedestrian: [5, 10, 20],
      };

      function erreichbarkeitLoeschen() {
        ['erreichbar-flaeche', 'erreichbar-rand'].forEach(id => {
          if (map.getLayer(id)) map.removeLayer(id);
        });
        if (map.getSource('erreichbar')) map.removeSource('erreichbar');
      }

      function erreichbarkeitZeigen(lat, lon) {
        const zeiten = ERREICHBAR_ZEITEN[costing] || [10, 20, 30];
        const art = { auto: 'Auto', bicycle: 'Rad', pedestrian: 'zu Fuß' }[costing] || costing;
        hud.textContent = `Erreichbarkeit ${art} …`;
        fetch(ROUTE_API + 'isochrone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            locations: [{ lat, lon }],
            costing,
            contours: zeiten.map(t => ({ time: t })),
            polygons: true,
            // Ohne diese beiden wird die Flaeche ein Netz aus tausenden
            // Zipfeln entlang jeder Sackgasse — unlesbar und schwer zu zeichnen.
            denoise: 0.4,
            generalize: 30,
          }),
        })
          .then(async r => {
            const roh = await r.text();
            let j = null;
            try { j = JSON.parse(roh); } catch (_) { /* keine JSON-Antwort */ }
            if (r.ok && j) return j;
            return Promise.reject({ error: (j && j.error) ||
              (r.status === 502 || r.status === 504
                ? 'Routing-Dienst antwortet nicht'
                : `Routing-Dienst meldet HTTP ${r.status}`) });
          })
          .then(daten => {
            erreichbarkeitLoeschen();
            // ★ Valhalla liefert die Ringe von der groessten Kontur zur
            //   kleinsten. Gezeichnet wird in Listenreihenfolge, also muss die
            //   kleinste zuletzt kommen — sonst deckt die 30-Minuten-Flaeche
            //   die 10-Minuten-Flaeche zu und alles sieht gleich weit aus.
            const teile = (daten.features || [])
              .slice()
              .sort((a, b) => (b.properties.contour || 0) - (a.properties.contour || 0));
            if (!teile.length) {
              hud.textContent = 'keine Fläche berechnet';
              return;
            }
            map.addSource('erreichbar', {
              type: 'geojson',
              data: { type: 'FeatureCollection', features: teile },
            });
            const klein = Math.min(...zeiten), gross = Math.max(...zeiten);
            map.addLayer({
              id: 'erreichbar-flaeche', type: 'fill', source: 'erreichbar',
              paint: {
                'fill-color': ['interpolate', ['linear'], ['get', 'contour'],
                               klein, '#2f6fb5', gross, '#a9c8e4'],
                'fill-opacity': 0.28,
              },
            }, erstesSymbol());
            map.addLayer({
              id: 'erreichbar-rand', type: 'line', source: 'erreichbar',
              paint: {
                'line-color': ['interpolate', ['linear'], ['get', 'contour'],
                               klein, '#24568c', gross, '#7ba5cd'],
                'line-width': 1.4,
              },
            }, erstesSymbol());
            hud.textContent = `${art}: ${zeiten.join(' / ')} Minuten`;
          })
          .catch(e => {
            const txt = (e && (e.error || e.message)) || 'Erreichbarkeit fehlgeschlagen';
            hud.textContent = String(txt);
          });
      }

      function routenpunktSetzen(feld, lat, lon) {
        punkte[feld] = { lat, lon };
        document.getElementById(feld).value = lat.toFixed(5) + ', ' + lon.toFixed(5);
        routeBox.style.display = 'block';
        routeBtn.classList.add('on');
      }

      function koordinatenKopieren(lat, lon) {
        const text = lat.toFixed(5) + ', ' + lon.toFixed(5);
        // Die Zwischenablage gibt es nur im sicheren Kontext. Ohne HTTPS bleibt
        // sie stumm — dann lieber sichtbar hinschreiben als so tun, als ginge es.
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text)
            .then(() => zeigen('Koordinaten kopiert: <code>' + text + '</code>'))
            .catch(() => zeigen('Kopieren abgelehnt. Koordinaten: <code>' + text + '</code>'));
        } else {
          zeigen('Zwischenablage nur über HTTPS. Koordinaten: <code>' + text + '</code>');
        }
      }

      map.on('contextmenu', e => { e.preventDefault && e.preventDefault(); menueOeffnen(e.point, e.lngLat); });
      map.on('movestart', menueSchliessen);
      map.on('click', menueSchliessen);

      // Langer Druck am Handy: MapLibre kennt dafuer kein eigenes Ereignis, und
      // 'contextmenu' loest auf Touch nicht zuverlaessig aus. Deshalb selbst
      // messen — abgebrochen, sobald der Finger wandert (dann wird geschoben)
      // oder ein zweiter Finger dazukommt (dann wird gezoomt).
      let druckTimer = null, druckStart = null;
      map.on('touchstart', e => {
        if (e.points && e.points.length > 1) { clearTimeout(druckTimer); return; }
        druckStart = e.point;
        clearTimeout(druckTimer);
        druckTimer = setTimeout(() => menueOeffnen(e.point, e.lngLat), 550);
      });
      map.on('touchmove', e => {
        if (!druckStart || !e.point) return;
        const weit = Math.abs(e.point.x - druckStart.x) > 12 ||
                     Math.abs(e.point.y - druckStart.y) > 12;
        if (weit) clearTimeout(druckTimer);
      });
      map.on('touchend', () => clearTimeout(druckTimer));

      // ---- Start und Ziel tauschen -----------------------------------------
      document.getElementById('rtausch').onclick = () => {
        const merk = punkte.rstart;
        punkte.rstart = punkte.rziel;
        punkte.rziel = merk;
        const text = rStart.value;
        rStart.value = rZiel.value;
        rZiel.value = text;
        rTrefferAus();
      };

      // In den Routenfeldern dieselbe Merkliste anbieten wie in der Ortssuche.
      [rStart, rZiel].forEach(inp => {
        inp.addEventListener('focus', () => {
          if (inp.value.trim()) return;
          const liste = merkListe();
          if (!liste.length) return;
          zeigeRoutenTreffer(liste.map(o => ({ n: '★ ' + o.n, lat: o.lat, lon: o.lon })), inp);
        });
      });

      // ---- Bildebenen: Satellit (DE+NL) und Luftbild (NRW, sehr scharf) -----
      // Beides sind Rasterkacheln in .pmtiles, genauso per HTTP-Range gelesen wie
      // die Vektorkarte. Sie ERSETZEN die Karte nicht, sie legen sich darueber:
      // ausserhalb des abgedeckten Gebiets existiert schlicht keine Kachel, dort
      // bleibt die normale Karte stehen. Deshalb ist der Uebergang vom Luftbild
      // (20x20 km um Heiligenhaus) zur Umgebung kein Loch, sondern Karte.
      const BILDEBENEN = [
        { id: 'satellit', label: 'Satellit',
          quellen: [{ name: 'bild-satellit', datei: 'satellit.pmtiles' }],
          hinweis: 'Sentinel-2 cloudless &copy; EOX IT Services GmbH ' +
                   '(CC BY-NC-SA 4.0), enth&auml;lt modifizierte Copernicus-Sentinel-Daten' },
        { id: 'luftbild', label: 'Luftbild',
          // Die Scharf-Inseln liegen ueber der Flaeche und beginnen erst bei
          // z19 — MapLibre zeigt dadurch von selbst die schaerfere Aufnahme,
          // wo es sie gibt. Zwei davon: Heiligenhaus und Solingen-Mitte.
          // ★ NOTBEHELF minzoom 14, bis die Bilder mit Alphakanal neu gebaut
          //   sind: die Kacheln sind JPEG und koennen keine Transparenz tragen,
          //   deshalb ist alles ausserhalb des Datenrechtecks mit Schwarz
          //   aufgefuellt. Gemessen sind die z11-Randkacheln zu 82-99 % schwarz
          //   (eine Kachel ist dort 19 km breit), was als dicker schwarzer
          //   Rahmen um das Luftbild erscheint. Ab z14 ist eine Kachel 2,4 km
          //   breit und der Saum faellt nicht mehr auf. Darunter zeigt die
          //   Karte einfach Karte oder Satellit. Nach dem Neubau entfaellt die
          //   Zeile — dann traegt jede Kachel Alpha und der Rand ist echt weg.
          quellen: [{ name: 'bild-umland',   datei: 'umland.pmtiles',   minzoom: 14 },
                    { name: 'bild-stadt',    datei: 'stadt.pmtiles',    minzoom: 19 },
                    { name: 'bild-solingen', datei: 'solingen.pmtiles', minzoom: 19 }],
          hinweis: 'Luftbilder &copy; Land NRW (dl-de/zero-2-0), opengeodata.nrw.de' },
      ];
      const bildsel = document.getElementById('bildsel');
      let bildmodus = null;                 // null = reine Karte

      function bildebeneEinhaengen() {
        const eb = BILDEBENEN.find(b => b.id === bildmodus);
        if (!eb) return;
        // ★ Nicht ganz nach oben haengen, sondern UNTER die erste
        //   Beschriftungsebene: das Bild deckt Flaechen und Strassen zu, die
        //   Orts- und Strassennamen bleiben aber darueber lesbar. Ganz oben
        //   waere das Luftbild eine schoene, aber namenlose Flaeche.
        let beschriftung;
        try {
          beschriftung = map.getStyle().layers.find(l => l.type === 'symbol');
        } catch (e) { return; }             // Stil gerade im Wechsel
        eb.quellen.forEach(q => {
          if (!map.getSource(q.name)) {
            map.addSource(q.name, {
              type: 'raster', tileSize: 256,
              url: 'pmtiles://' + location.origin + '/maps/' + q.datei,
              attribution: eb.hinweis,
            });
          }
          if (!map.getLayer(q.name)) {
            const ebene = { id: q.name, type: 'raster', source: q.name };
            if (q.minzoom) ebene.minzoom = q.minzoom;
            map.addLayer(ebene, beschriftung && beschriftung.id);
          }
        });
      }

      function bildebeneEntfernen() {
        BILDEBENEN.flatMap(b => b.quellen).forEach(q => {
          if (map.getLayer(q.name)) map.removeLayer(q.name);
          if (map.getSource(q.name)) map.removeSource(q.name);
        });
      }

      function setzeBildmodus(id) {
        bildebeneEntfernen();
        bildmodus = id;
        // Die Grenze liegt generell bei 20 (siehe Kommentar am Map-Aufruf) und
        // wird beim Moduswechsel nur wiederhergestellt, nicht mehr je nach
        // Bildebene gesenkt.
        map.setMaxZoom(20);
        if (id) bildebeneEinhaengen();
        [...bildsel.children].forEach(c =>
          c.classList.toggle('on', c.dataset.id === (id || 'karte')));
      }

      // ★ setStyle (Regionswechsel) wirft alle selbst gelegten Ebenen weg.
      //   Ohne dieses Wiedereinhaengen verschwaende das Luftbild lautlos, sobald
      //   jemand die Kartenregion umschaltet. Dasselbe gilt fuer Gelaende und
      //   Gebaeude — und beim Gelaende faellt es besonders auf, weil die Karte
      //   gekippt bleibt und dabei flach wird.
      map.on('styledata', () => {
        if (bildmodus) bildebeneEinhaengen();
        reliefWiederherstellen();
      });

      // Nur anbieten, was wirklich da ist — die Bilddaten entstehen in langen
      // Rechenlaeufen und fehlen zwischendurch.
      Promise.all(BILDEBENEN.map(eb =>
        Promise.all(eb.quellen.map(q =>
          fetch('/maps/' + q.datei, { method: 'HEAD' })
            .then(r => r.ok).catch(() => false)
        )).then(da => {
          // Die Feinstufe darf fehlen, ohne die Grobstufe mitzureissen: solange
          // umland.pmtiles da ist, ist „Luftbild" benutzbar.
          eb.quellen = eb.quellen.filter((q, i) => da[i]);
          return eb.quellen.length ? eb : null;
        })
      )).then(verfuegbar => {
        const da = verfuegbar.filter(Boolean);
        if (!da.length) return;              // keine Bilddaten -> kein Umschalter
        bildsel.style.display = 'block';
        [{ id: null, label: 'Karte' }].concat(da).forEach(eb => {
          const b = document.createElement('button');
          b.textContent = eb.label;
          b.dataset.id = eb.id || 'karte';
          b.className = eb.id ? '' : 'on';
          b.onclick = () => setzeBildmodus(eb.id);
          bildsel.appendChild(b);
        });
      });

      // ---- Relief: 3D-Gelaende und Gebaeudehoehen ---------------------------
      // Zwei unabhaengige Schalter auf zwei Dateien:
      //   gelaende.pmtiles  Hoehenraster aus DGM1 (1 m Raster), Terrarium-kodiert
      //   gebaeude.pmtiles  LoD2-Grundrisse mit Firsthoehe je Gebaeude
      //
      // ★ `encoding: 'terrarium'` ist PFLICHT und wird NICHT aus der Datei
      //   gelesen. MapLibres Vorgabe ist die Mapbox-Kodierung, und die rechnet
      //   dieselben Bytes voellig anders um: aus 200 m Hoehe wuerden rund
      //   1,3 Millionen. Das Ergebnis ist keine leichte Verzerrung, sondern eine
      //   senkrechte Nadelwand — auffaellig, aber die Ursache sieht man ihr nicht an.
      const RELIEF_QUELLE = 'gelaende';
      const GEB_QUELLE = 'gebaeude';
      let gelaendeAn = false, gebaeudeAn = false;

      function erstesSymbol() {
        try {
          const l = map.getStyle().layers.find(x => x.type === 'symbol');
          return l && l.id;
        } catch (e) { return undefined; }
      }

      function gelaendeEinhaengen() {
        if (!map.getSource(RELIEF_QUELLE)) {
          map.addSource(RELIEF_QUELLE, {
            type: 'raster-dem',
            url: 'pmtiles://' + location.origin + '/maps/gelaende.pmtiles',
            // 256 statt der MapLibre-Vorgabe 512: so sind die Kacheln gebaut.
            // Stimmt das nicht, ist das Gelaende um Faktor zwei verschoben.
            tileSize: 256,
            encoding: 'terrarium',
            attribution: 'H&ouml;hendaten &copy; Land NRW (dl-de/zero-2-0)',
          });
        }
        // Schummerung auch in der flachen Ansicht: sie zeigt die Taeler des
        // Bergischen schon von oben, ohne dass man kippen muss.
        if (!map.getLayer('schummerung')) {
          map.addLayer({
            id: 'schummerung', type: 'hillshade', source: RELIEF_QUELLE,
            paint: {
              'hillshade-exaggeration': 0.45,
              'hillshade-shadow-color': '#5b6a72',
              'hillshade-highlight-color': '#fffdf8',
            },
          }, erstesSymbol());
        }
        map.setTerrain({ source: RELIEF_QUELLE, exaggeration: 1.3 });
      }

      function gelaendeEntfernen() {
        map.setTerrain(null);
        if (map.getLayer('schummerung')) map.removeLayer('schummerung');
        // Quelle stehen lassen: sie wird von der Hoehenanzeige weiterbenutzt
        // und ein erneutes Einschalten geht dann ohne Nachladen.
      }

      function gebaeudeEinhaengen() {
        // ★ ZWEI Gebäudequellen, bewusst übereinander:
        //   Das LoD2-Modell ist genauer und vollständig — aber nur für die
        //   gebaute Fläche. Wer nach Köln oder Berlin scrollt, hätte dort gar
        //   keine Gebäude. Die Vektorkarte führt für ganz DE+NL ein `height`-
        //   Feld (in unserer Region bei 17 % der Gebäude gefüllt, anderswo
        //   mehr). Die OSM-Lage liegt deshalb UNTEN und trägt die Fläche;
        //   das LoD2-Modell liegt darüber und gewinnt, wo es existiert.
        if (!map.getLayer('gebaeude-osm')) {
          map.addLayer({
            id: 'gebaeude-osm', type: 'fill-extrusion', source: 'protomaps',
            'source-layer': 'buildings', minzoom: 14,
            filter: ['has', 'height'],
            paint: {
              'fill-extrusion-color': '#ded7cd',
              'fill-extrusion-height': ['get', 'height'],
              // min_height trägt Bauteile, die erst über Grund beginnen
              // (Vordächer, aufgeständerte Etagen). Fehlt es, ist 0 richtig.
              'fill-extrusion-base': ['coalesce', ['get', 'min_height'], 0],
              'fill-extrusion-opacity': 0.9,
            },
          }, erstesSymbol());
        }
        if (!map.getSource(GEB_QUELLE)) {
          map.addSource(GEB_QUELLE, {
            type: 'vector',
            url: 'pmtiles://' + location.origin + '/maps/gebaeude.pmtiles',
            attribution: 'Geb&auml;udemodelle &copy; Land NRW (dl-de/zero-2-0)',
          });
        }
        if (!map.getLayer('gebaeude-3d')) {
          map.addLayer({
            id: 'gebaeude-3d', type: 'fill-extrusion', source: GEB_QUELLE,
            'source-layer': 'gebaeude',
            // Unter z14 waeren Gebaeude wenige Bildpunkte gross — sichtbar
            // waere davon nichts, geladen alles.
            minzoom: 14,
            paint: {
              'fill-extrusion-color': [
                // Hohe Gebaeude etwas kuehler: das gibt der Silhouette Tiefe,
                // ohne bunt zu werden.
                'interpolate', ['linear'], ['get', 'hoehe'],
                3, '#e0d9d0', 12, '#cfc7bd', 30, '#b9b3ac',
              ],
              'fill-extrusion-height': ['get', 'hoehe'],
              'fill-extrusion-base': 0,
              // Beim Einblenden weich aufziehen statt hart erscheinen.
              'fill-extrusion-opacity': 0.92,
            },
          }, erstesSymbol());
        }
      }

      function gebaeudeEntfernen() {
        if (map.getLayer('gebaeude-3d')) map.removeLayer('gebaeude-3d');
        if (map.getLayer('gebaeude-osm')) map.removeLayer('gebaeude-osm');
      }

      function reliefWiederherstellen() {
        if (gelaendeAn) gelaendeEinhaengen();
        if (gebaeudeAn) gebaeudeEinhaengen();
      }

      function schalteGelaende(an) {
        gelaendeAn = an;
        if (an) {
          gelaendeEinhaengen();
          // Flach betrachtet sieht 3D-Gelaende aus wie gar nichts. Einmal
          // kippen macht den Sinn sofort sichtbar — aber nur, wenn der Nutzer
          // die Kamera nicht schon selbst eingestellt hat.
          if (map.getPitch() < 10) map.easeTo({ pitch: 55, duration: 800 });
        } else {
          gelaendeEntfernen();
          if (map.getPitch() > 10) map.easeTo({ pitch: 0, duration: 600 });
        }
      }

      function schalteGebaeude(an) {
        gebaeudeAn = an;
        an ? gebaeudeEinhaengen() : gebaeudeEntfernen();
        // Gebaeude ohne Kippen sind nur graue Flecken.
        if (an && map.getPitch() < 10) map.easeTo({ pitch: 55, duration: 800 });
      }

      // Nur anbieten, was gebaut ist — die Datensaetze entstehen in langen
      // Rechenlaeufen und fehlen zwischendurch.
      const reliefsel = document.getElementById('reliefsel');
      Promise.all([
        fetch('/maps/gelaende.pmtiles', { method: 'HEAD' }).then(r => r.ok).catch(() => false),
        fetch('/maps/gebaeude.pmtiles', { method: 'HEAD' }).then(r => r.ok).catch(() => false),
      ]).then(([hatGelaende, hatGebaeude]) => {
        if (!hatGelaende && !hatGebaeude) return;
        reliefsel.style.display = 'block';
        const knopf = (text, titel, schalter) => {
          const b = document.createElement('button');
          b.textContent = text;
          b.title = titel;
          b.onclick = () => { const an = !b.classList.contains('on');
                              b.classList.toggle('on', an); schalter(an); };
          reliefsel.appendChild(b);
        };
        if (hatGelaende) knopf('Gelände', 'Höhenrelief und Schummerung', schalteGelaende);
        if (hatGebaeude) knopf('Gebäude', 'Gebäudehöhen aus dem Landesmodell', schalteGebaeude);
      });

      // ---- POI-Sichten: was frueh sichtbar ist, ist eine Entscheidung -------
      // Die Karte kann nicht alles zugleich zeigen. `poi-label-wichtig` bringt
      // eine kleine Liste schon ab z14, alles Uebrige erst ab z16. Diese
      // Grundliste ist Daseinsvorsorge (Klinik, Apotheke, Feuerwehr, Tankstelle,
      // Haltestelle) und stammt aus der Herkunft des Portals als Offline-Wissen
      // fuer den Fall, dass das Netz weg ist. Eine Universitaet lag darin
      // gleichauf mit einem Spielzeugladen: beide erst ab z16.
      //
      // Die Sichten LEGEN NUR NACH, sie tauschen nicht: wer „Bildung" waehlt,
      // sieht Hochschulen und Museen genauso frueh und verliert dabei kein
      // Krankenhaus. Ein Tausch waere die schlechtere Wahl, weil man den Verlust
      // erst bemerkt, wenn man das Fehlende sucht.
      //
      // ★ Die Listen stehen in style.json (`metadata.poi-sichten`), nicht hier.
      //   Nur so liest tests/poi-arten.py sie mit und meldet Arten, die es in
      //   den Kacheln gar nicht gibt. Genau daran hing der Fund vom 2026-09-06:
      //   `bus_stop`, `atm`, `drinking_water` und `water_point` standen in der
      //   Grundliste und kommen in 10393 gemessenen Objekten kein einziges Mal
      //   vor. Haltestellen heissen bei Protomaps `platform` (647 Treffer).
      const poisel = document.getElementById('poisel');
      const poiMeta = (style.metadata || {})['poi-sichten'] || {};
      const POI_SICHTEN = poiMeta.sichten || [];
      // Die Grundliste wird aus dem Stil GELESEN, nicht hier abgeschrieben:
      // eine zweite Kopie wuerde beim naechsten Eingriff still auseinanderlaufen.
      const grundArten = (() => {
        const l = (style.layers || []).find(x => x.id === 'poi-label-wichtig');
        const m = l && (l.filter || []).find(t => Array.isArray(t) && t[0] === 'match');
        return (m && Array.isArray(m[2])) ? m[2] : [];
      })();
      let poiSicht = 'notfall';
      try { poiSicht = localStorage.getItem('poi-sicht') || 'notfall'; } catch (e) {}
      // ★★ Die spaete Ebene beginnt laut Stil erst bei z16. Fuer „Alles" reicht
      //    es deshalb NICHT, ihren Filter zu oeffnen: bei z15 wird sie gar nicht
      //    gezeichnet, und „Alles" sah dort Pixel fuer Pixel aus wie „Notfall"
      //    (gemessen 2026-09-06 an einem Pruefbild, das genau deshalb entstand).
      //    Die Grenze muss also mitwandern. Beide Werte werden aus dem Stil
      //    gelesen, damit eine spaetere Aenderung dort hier nicht vorbeilaeuft.
      const poiZoom = (id, vorgabe) => {
        const l = (style.layers || []).find(x => x.id === id);
        return (l && typeof l.minzoom === 'number') ? l.minzoom : vorgabe;
      };
      const POI_SPAET = poiZoom('poi-label', 16);
      const POI_FRUEH = poiZoom('poi-label-wichtig', 14);

      function poiFilterSetzen() {
        if (!grundArten.length) return;
        const s = POI_SICHTEN.find(x => x.id === poiSicht);
        const alles = poiSicht === 'alles';
        const menge = alles ? grundArten
                            : [...new Set(grundArten.concat(s ? s.arten : []))];
        const neu = {
          'poi-label-wichtig':
            ['all', ['has', 'name'], ['match', ['get', 'kind'], menge, true, false]],
          // „Alles" heisst nicht alles auf einmal: die min_zoom-Bedingung bleibt,
          // sonst stuenden schlagartig alle 342 Arten uebereinander und die
          // Karte waere unlesbarer als vorher.
          'poi-label': alles
            ? ['all', ['has', 'name'], ['<=', ['get', 'min_zoom'], ['zoom']]]
            : ['all', ['has', 'name'], ['<=', ['get', 'min_zoom'], ['zoom']],
               ['match', ['get', 'kind'], menge, false, true]],
        };
        try {
          for (const [ebene, filter] of Object.entries(neu)) {
            // ★★ Nur bei echter Abweichung setzen. `setFilter` loest selbst ein
            //    `styledata` aus, und dieser Aufruf haengt an genau diesem
            //    Ereignis: bedingungsloses Setzen waere eine Endlosschleife, die
            //    sich als hohe Prozessorlast zeigt und nicht als Fehler.
            if (JSON.stringify(map.getFilter(ebene)) !== JSON.stringify(filter)) {
              map.setFilter(ebene, filter);
            }
          }
          const grenze = alles ? POI_FRUEH : POI_SPAET;
          const jetzt = map.getLayer('poi-label');
          if (jetzt && jetzt.minzoom !== grenze) {
            map.setLayerZoomRange('poi-label', grenze, 24);
          }
        } catch (e) { /* Stil gerade im Wechsel; das naechste styledata setzt nach */ }
      }

      function setzePoiSicht(id) {
        poiSicht = id;
        try { localStorage.setItem('poi-sicht', id); } catch (e) {}
        poiFilterSetzen();
        [...poisel.children].forEach(c => c.classList.toggle('on', c.dataset.id === id));
      }

      if (POI_SICHTEN.length && grundArten.length) {
        poisel.style.display = 'block';
        [{ id: 'notfall', label: 'Notfall',
           titel: 'Nur die Daseinsvorsorge früh zeigen: Klinik, Apotheke, Feuerwehr, '
                + 'Polizei, Tankstelle, Supermarkt, Bäcker, Bank, Post, Bahnhof, Haltestelle' }]
          .concat(POI_SICHTEN)
          .concat([{ id: 'alles', label: 'Alles',
                     titel: 'Keine Vorauswahl: jede Art erscheint, sobald Protomaps sie vorsieht' }])
          .forEach(s => {
            const b = document.createElement('button');
            b.textContent = s.label;
            b.title = s.titel || '';
            b.dataset.id = s.id;
            b.className = (s.id === poiSicht) ? 'on' : '';
            b.onclick = () => setzePoiSicht(s.id);
            poisel.appendChild(b);
          });
        poiFilterSetzen();
        // ★ setStyle (Regionswechsel) setzt die Filter auf die Stil-Vorgabe
        //   zurueck. Ohne dieses Nachsetzen faellt die gewaehlte Sicht beim
        //   Regionswechsel lautlos auf „Notfall", waehrend der Knopf weiter
        //   blau bleibt und Gegenteiliges behauptet.
        map.on('styledata', poiFilterSetzen);
      }

      // ---- Einbettung: die Karte als Baustein anderer Anwendungen ----------
      // Aufruf: /?einbetten=1&markierung=<lat>,<lon>&zoom=16&sicht=alltag
      //
      // Gedacht fuer kleine Kartenflaechen in fremden Oberflaechen (etwa die
      // Adresse eines Kontakts im Kalender). Ueber ein iframe und NICHT ueber
      // eingebundenes MapLibre, und das ist die eigentliche Entscheidung:
      //
      //  * kein CORS. Kacheln, Schriften und Sprites blieben sonst am
      //    Ursprungsschutz haengen, und man muesste sie fuer jede fremde
      //    Herkunft freigeben.
      //  * keine zweite Kopie von MapLibre, pmtiles.js, Schriften und Stil in
      //    jeder Anwendung, die eine Karte zeigen will.
      //  * eine Verbesserung hier wirkt ueberall, statt in n Kopien zu altern.
      //
      // Die einbettende Seite muss dafuer nur eine Adresse zusammensetzen.
      const einbett = new URLSearchParams(location.search);
      if (einbett.get('einbetten') === '1') {
        document.body.classList.add('einbetten');
        const teile = (einbett.get('markierung') || '').split(',').map(Number);
        const zoom = Number(einbett.get('zoom')) || 16;
        if (teile.length === 2 && teile.every(Number.isFinite)) {
          const [lat, lon] = teile;
          // ★ jumpTo statt center/zoom im Konstruktor: die Karte wird mit
          //   `hash: true` gebaut und uebernimmt beim Start den Adress-Hash.
          //   Ohne diesen Sprung landete eine Einbettung ohne Hash auf der
          //   Uebersicht von Deutschland und zeigte einen Marker, den man erst
          //   suchen muss.
          map.jumpTo({ center: [lon, lat], zoom });
          new maplibregl.Marker({ color: '#a3402f' }).setLngLat([lon, lat]).addTo(map);
          const gross = document.getElementById('groesser');
          gross.href = `/#${zoom}/${lat}/${lon}`;
          gross.title = einbett.get('titel') || '';
        }
        // Die Sicht laesst sich mitgeben: wer eine Adresse zeigt, will meist
        // wissen, was drumherum ist, und nicht nur die Daseinsvorsorge.
        const sicht = einbett.get('sicht');
        if (sicht && typeof setzePoiSicht === 'function') setzePoiSicht(sicht);
      }

      // Regionen-Umschalter: nur Regionen anbieten, deren .pmtiles wirklich da ist.
      const sel = document.getElementById('regionsel');
      Promise.all(REGIONEN.map(r =>
        fetch('/maps/' + r.datei, { method: 'HEAD' })
          .then(res => res.ok ? r : null).catch(() => null)
      )).then(vorhanden => {
        const da = vorhanden.filter(Boolean);
        if (!da.length) { warn('Keine Kartendatei gefunden — extract-maps.sh läuft?'); return; }
        if (da[0].id !== aktuell.id) {           // bevorzugte Karte fehlt -> umschwenken
          aktuell = da[0];
          map.setStyle(styleFuer(aktuell));
        }
        if (da.length < 2) return;               // nur eine Karte -> kein Umschalter
        sel.style.display = 'block';
        da.forEach(r => {
          const b = document.createElement('button');
          b.textContent = r.label;
          b.className = (r.id === aktuell.id) ? 'on' : '';
          b.onclick = () => {
            if (r.id === aktuell.id) return;
            aktuell = r;
            // Style tauschen statt Karte neu bauen -> Position/Zoom bleiben erhalten.
            map.setStyle(styleFuer(r));
            [...sel.children].forEach(c => c.classList.toggle('on', c === b));
          };
          sel.appendChild(b);
        });
      });
    }).catch(() => warn('style.json konnte nicht geladen werden.'));
  </script>
</body>
</html>
