# Offline-Karten (pmtiles + MapLibre). Statisch, read-only, LAN-only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ style.json NIE lange cachen. Steckte bis 2026-08-16 im generischen
    # .json-Block mit "immutable, 30d" — nach einer Style-Aenderung sahen
    # Browser tagelang den alten Stand (Strassennamen fehlten scheinbar).
    location = /style.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        etag on;
    }

    # Handy-Manifest („Zum Startbildschirm hinzufuegen"). nginx kennt die Endung
    # .webmanifest nicht und lieferte sie sonst als Binaerstrom aus — Android
    # ignoriert das Manifest dann stillschweigend.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Ortsindex fuer die Suche: gross, statisch, aber versionierbar per ?v=
    # (index.html haengt eine Version an) -> darf lange gecacht werden.
    location = /maps/places.json {
        default_type application/json;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # pmtiles wird per HTTP-Range-Request gelesen -> Ranges müssen an bleiben
    # und Kompression aus (pmtiles ist intern bereits komprimiert).
    location /maps/ {
        add_header Accept-Ranges bytes;
        gzip off;
        types { }
        default_type application/octet-stream;
        expires 7d;
    }

    # Glyphen sind wirklich unveraenderlich: eine Schriftart aendert sich nicht,
    # und neue Zeichenbereiche kaemen unter neuem Dateinamen.
    location ~* ^/fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ⚠ Sprites standen bis 2026-08-25 hier mit drin — mit „immutable, 30d“.
    # Das Sheet waechst aber, sobald Symbole dazukommen (zuletzt 53 -> 72), und
    # MapLibre haengt an den Sprite-Pfad selbst `.json`/`.png` an: ein
    # Versionsanhaengsel wie bei style.json ist deshalb nicht moeglich
    # (`/sprites/light?v=2.json` gibt es nicht). Ein Browser mit altem Sheet
    # haette die neuen Symbole einen Monat lang nicht gesehen — und die Karte
    # haette dabei fehlerfrei ausgesehen, nur ohne Icons.
    # Jetzt: kurz cachen, aber immer rueckfragen. 30 KB kosten nichts.
    location ~* ^/sprites/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        etag on;
    }

    # Routing (Valhalla auf LXC 102, 192.0.2.10:8002). Bewusst ueber diesen
    # Proxy statt direkt aus dem Browser: der Dienst ist per Firewall nur fuer
    # host/node1 offen, und ueber denselben Ursprung entfaellt jedes CORS-Thema.
    #
    # proxy_pass mit literaler Adresse und abschliessendem Schraegstrich —
    # dadurch faellt das /route/-Praefix weg (/route/route -> /route). Eine
    # Variable waere hier falsch: `proxy_pass $var/pfad` ersetzt die Request-URI
    # komplett (dieselbe Falle wie beim Schach-Proxy, 2026-08-15).
    location /route/ {
        proxy_pass http://192.0.2.10:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Routen fuer lange Strecken brauchen Sekunden, nicht Millisekunden.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        # Antworten sind pro Anfrage verschieden — nichts davon darf im Browser
        # oder Zwischenspeicher haengenbleiben.
        add_header Cache-Control "no-store";
    }

    # Sprachansagen fuers Navi. Der Browser darf den TTS-Dienst nicht direkt
    # ansprechen: die Seite laeuft ueber HTTPS (karten.home.arpa), ein Aufruf
    # nach http://192.0.2.10:8146 waere Mixed Content und wird unabhaengig von
    # jeder Firewall blockiert. Ueber diesen Weg spricht der Browser nur mit
    # seiner eigenen Herkunft.
    #
    # ⚠ HEUTE NOCH TOT: der DOCKER-USER-Lock auf host laesst an Port 8146 nur
    #   192.0.2.10 durch, node1 liegt im verworfenen 192.0.2.10/24. Damit
    #   dieser Weg traegt, muss ALLOW in tts-gateway-fw.sh um 192.0.2.10
    #   erweitert werden (Port 8147 hat dieselbe Freigabe bereits). Bis dahin
    #   laeuft der Aufruf in den Verbindungsfehler, das Frontend faellt auf die
    #   Stimme des Browsers zurueck, und die Navigation funktioniert stumm
    #   weiter. Deshalb sind die Fristen kurz: ein toter Weg soll schnell
    #   scheitern, nicht die Ansagen-Vorproduktion minutenlang blockieren.
    #
    # ★ Im Navi-Kit auf dem Geraet zeigt dieselbe Weiche auf einen lokalen
    #   Piper-Container. Ein Anschluss, zwei Rueckseiten — das Frontend kennt
    #   den Unterschied nicht.
    location /tts/ {
        proxy_pass http://192.0.2.10:8146/api/tts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-TTS-Engine $http_x_tts_engine;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        # Zwischengespeichert wird im Browser (CacheStorage), nicht hier —
        # dort ueberlebt es den Verbindungsverlust unterwegs.
        add_header Cache-Control "no-store";
    }

    # Adresssuche mit Hausnummern (Dienst im Nachbarcontainer). Gleiche Bauart
    # wie /route/ oben: literale Adresse mit abschliessendem Schraegstrich, damit
    # das Praefix wegfaellt (/adressen/orte -> /orte).
    #
    # ★ Literale IP und NICHT der Containername: nginx loest einen Namen genau
    #   einmal beim Start auf. Bekaeme der Dienst beim naechsten Neubau eine
    #   andere Adresse, lieferte nginx bis zum Neuladen 502 — ein Fehler, der
    #   erst Tage spaeter auffaellt. Die Adresse ist im Compose fest vergeben.
    location /adressen/ {
        proxy_pass http://172.23.144.10:8148/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        add_header Cache-Control "no-store";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html immer frisch ausliefern, sonst haengt das Frontend hinterher.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
